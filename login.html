<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VITAP Digital Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-wrapper">
    
    <!-- Bank branding logo header -->
    <div class="login-logo-container">
      <div class="brand" style="justify-content: center; margin-bottom: 12px;">
        <div class="brand-logo">A</div>
        <span class="brand-name">VITAP DIGITAL BANK</span>
      </div>
      <h2>Secure Banking Portal</h2>
      <p>Enter your credentials to access your retail account</p>
    </div>

    <!-- Main login card container -->
    <div class="card" style="padding: 30px;">
      
      <!-- Optional alert banner for login failure scenario -->
      <!-- Remove comment tag below to test error display state -->
      <!--
      <div class="alert alert-danger">
        <strong>Invalid Credentials:</strong> The username or password entered is incorrect. Please try again.
      </div>
      -->

      <!-- Standard secure credentials form -->
      <form action="beneficiary.html" method="GET">
        
        <!-- Username entry element -->
        <div class="form-group">
          <label for="username">Retail Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="input-control" 
            placeholder="yakshitha" 
            value="yakshitha"
            required
          >
        </div>

        <!-- Password entry element -->
        <div class="form-group" style="margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="password">Password</label>
          </div>
          <div class="password-container">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="input-control" 
              placeholder="••••••••" 
              value="password"
              required
            >
            <button type="button" class="password-toggle-btn" id="passwordToggle" aria-label="Toggle Password Visibility">
              <!-- Eye open icon SVG -->
              <svg id="eyeOpenIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <!-- Eye closed icon SVG -->
              <svg id="eyeClosedIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <!-- Submit login action -->
        <button type="submit" class="btn btn-primary btn-block">
          Access portal
        </button>

      </form>

    </div>

  </div>

  <script>
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    const eyeOpenIcon = document.getElementById('eyeOpenIcon');
    const eyeClosedIcon = document.getElementById('eyeClosedIcon');

    passwordToggle.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeOpenIcon.style.display = 'none';
        eyeClosedIcon.style.display = 'inline-block';
      } else {
        passwordInput.type = 'password';
        eyeOpenIcon.style.display = 'inline-block';
        eyeClosedIcon.style.display = 'none';
      }
    });
  </script>

</body>
</html>
